name: Shared contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Create test Python environment
        run: python -m venv .venv312
      - name: Check generated contracts
        run: node scripts/generate-contracts.mjs --check
      - name: Check RPC inventory
        run: .venv312/Scripts/python.exe scripts/contract-coverage.py --check
      - name: Verify both runtimes and response rejection
        run: node --test tests/node/generated-contracts.test.mjs tests/node/contract-runtime.test.mjs tests/node/response-contract.test.mjs
      - name: Install locked desktop dependencies
        run: npm ci
      - name: Check desktop types
        run: npm run typecheck
